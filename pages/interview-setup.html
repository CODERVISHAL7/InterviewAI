<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Interview Setup — InterviewAI</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/auth-guard.css"></head><body><div class="notice auth-setup-error" data-auth-error hidden role="alert"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">IA</span><span>Interview<span>AI</span></span></a><a class="btn btn-ghost btn-sm" href="dashboard.html">← Dashboard</a></header><main class="form-shell"><section class="form-card card"><span class="eyebrow">INTERVIEW SETUP</span><h1>Configure your practice</h1><p>Choose the interview parameters. This configuration will be saved to your account.</p><div class="notice" data-interview-message hidden role="alert"></div><form data-interview-setup-form><div class="form-group"><label for="job_role">Job role</label><select id="job_role" name="job_role" required><option value="">Select a role</option><option>Software Developer</option><option>Java Developer</option><option>Web Developer</option><option>Data Analyst</option><option>Cyber Security Analyst</option></select></div><div class="form-group"><label for="interview_type">Interview type</label><select id="interview_type" name="interview_type" required><option>Technical</option><option>HR</option><option>Mixed</option></select></div><div class="form-group"><label for="difficulty">Difficulty</label><select id="difficulty" name="difficulty" required><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div><div class="form-group"><label for="company">Company <span class="form-note">(optional)</span></label><input id="company" name="company" maxlength="120" placeholder="e.g. TCS, Infosys, Google"></div><div class="form-group"><label for="skills">Skills / topics <span class="form-note">(optional)</span></label><textarea id="skills" name="skills" rows="3" maxlength="1000" placeholder="e.g. Java, SQL, OOP, Computer Networks"></textarea></div><div class="form-group"><label for="resume">Resume <span class="form-note">(optional — PDF, DOC, DOCX, max 10 MB)</span></label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div class="form-note" data-resume-status>Resume will be securely processed and used only to personalize this interview.</div></div><div class="form-group"><label for="total_questions">Number of questions</label><select id="total_questions" name="total_questions" required><option>5</option><option selected>10</option><option>15</option></select></div><button class="btn btn-primary full-width" type="submit">Create interview →</button></form></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/protected.js"></script><script src="../js/interview-setup.js"></script></body></html>
