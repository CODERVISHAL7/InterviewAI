<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — InterviewAI</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">IA</span><span>Interview<span>AI</span></span></a><a class="btn btn-ghost btn-sm" href="../index.html">← Home</a></header><main class="form-shell"><section class="form-card card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Set up your interview practice workspace.</p><form data-auth-form data-mode="register"><div class="form-group"><label for="name">Full name</label><input id="full_name" name="full_name" type="text" placeholder="Your name" required></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="8" placeholder="At least 8 characters" required></div><button class="btn btn-primary full-width" type="submit">Create account</button></form><div class="notice" data-auth-message hidden role="alert"></div><p class="auth-links">Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/auth-pages.js"></script></body></html>
